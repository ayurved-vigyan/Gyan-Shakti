<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gyan Shakti — Home</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-header">
    <div class="brand">
      <div class="logo">G</div>
      <div>
        <strong>GYAN SHAKTI</strong>
        <small>Education • Competition • Growth</small>
      </div>
    </div>

    <div class="search">
      <input type="search" placeholder="Search exams, courses, competitions..." />
      <button aria-label="Search">⌕</button>
    </div>

    <div class="actions">
      <button class="icon-btn" aria-label="Notifications">🔔</button>
      <button class="login-btn">Login / Register</button>
    </div>
  </header>

  <nav class="main-nav">
    <a class="active" href="#">Home</a>
    <a href="#">Exams</a>
    <a href="#">Competitions</a>
    <a href="#">Courses</a>
    <a href="#">Scholarships</a>
    <a href="#">Events</a>
    <a href="#">Community</a>
    <a href="#">More</a>
  </nav>

  <main>
<!-- GYAN SHAKTI AUTH MODAL -->
<div id="authModal" class="modal-overlay" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">

    <button
      type="button"
      class="close-btn"
      id="closeAuthModal"
      aria-label="Close">
      ✕
    </button>

    <div class="modal-header">
      <h2 id="authTitle">GYAN SHAKTI</h2>
      <p>Welcome back! Please login to your account.</p>
    </div>

    <form id="loginForm" class="form-container">

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Email Address"
        class="input-field"
        required
        autocomplete="email">

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        class="input-field"
        required
        autocomplete="current-password">

      <button type="submit" class="submit-btn">
        Sign In
      </button>

      <p class="footer-text">
        Don't have an account?
        <a href="#" id="registerLink">Register here</a>
      </p>

    </form>
  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
